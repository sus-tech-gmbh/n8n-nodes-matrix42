name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # n8n-workflow 2.x transitively needs isolated-vm 6, whose native build
      # requires Node 22+ — the same floor n8n 2.x itself has.
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # n8n's new community-nodes linter — enforces verified-nodes rules the
      # classic eslint-plugin-n8n-nodes-base misses (e.g. require-node-api-error)
      - run: npx --yes @n8n/node-cli@latest lint
      - run: npm test
      - run: npm run build
